<header class="top"><div class="top-in"><a class="logo" href="./"><b>士業ストック</b><small>石山通りグループの説明イラスト</small></a><nav aria-label="サイトの案内"><a href="./" aria-current="page">素材をさがす</a><a href="templates.html">スライドのひな形</a><a href="yobo.html">要望を送る</a><a href="about.html">このサイトについて</a><a href="terms.html">利用の決まり</a></nav></div></header>
<section class="hero"><div class="hero-in">
  <h1>仕事を絵で説明する素材</h1>
  <p class="lead">説明会、依頼された方への説明、採用の案内、社内の資料に使えます。相談から完了まで、同じ絵柄でそろえています。</p>
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="ことばでさがす（例　相続、立会い）" aria-label="ことばでさがす"></div>
  <p class="stats" id="stats"></p>
</div></section>
<section class="sec" aria-labelledby="h-cats"><h2 id="h-cats">分野からさがす</h2><div id="cats"></div></section>
<section class="sec" aria-label="絞りこみ"><div class="panel">
  <div class="row"><span class="lab">段階</span><div class="chips" id="f-dankai"></div></div>
  <div class="row"><span class="lab">種類</span><div class="chips" id="f-kind"></div></div>
  <div class="tail"><button class="chip fav" id="f-fav" aria-pressed="false">★ お気に入りだけ</button><button class="clear" id="clear" hidden>条件をすべて外す</button></div>
</div></section>
<div class="result" id="result" aria-live="polite"><span class="n" id="count"></span><span class="cond" id="cond"></span></div>
<main class="grid" id="grid"></main>
<p class="note">絵の右上の☆を押すとお気に入りに入ります。お気に入りは、使っているブラウザだけに残ります。</p>
<footer><div class="foot-in"><span>© 石山通りグループ</span><nav aria-label="下の案内"><a href="templates.html">スライドのひな形</a><a href="yobo.html">要望を送る</a><a href="about.html">このサイトについて</a><a href="terms.html">利用の決まり</a></nav></div></footer>
<script src="items.js"></script>
<script src="fav.js?v=1004"></script>
<script>
const DANKAI=["相談","見積もり","調査","現場","書類","申請","完了","その後"];
const SHIKAKU=["共通","司法書士","土地家屋調査士","行政書士","社労士","税理士","弁護士","社内イベント","業務の見直し"];
const KIND=["人","場面","道具","書類の形","場所","図解の部品"];
const ICON={"共通":"kyoutsu","司法書士":"shihoshoshi","土地家屋調査士":"chousashi","行政書士":"gyoseishoshi","社労士":"sharoushi","税理士":"zeirishi","弁護士":"bengoshi","社内イベント":"shanai-event","業務の見直し":"gyomu-minaoshi"};
const st={dankai:null,shikaku:null,kind:null,q:"",fav:false};
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function chips(el,list,key){list.forEach(v=>{const b=document.createElement("button");b.className="chip";b.textContent=v;b.dataset.v=v;b.setAttribute("aria-pressed","false");b.onclick=()=>{st[key]=st[key]===v?null:v;render()};el.appendChild(b)})}
chips($("f-dankai"),DANKAI,"dankai");
chips($("f-kind"),KIND,"kind");
SHIKAKU.forEach(v=>{const b=document.createElement("button");b.className="cat";b.dataset.v=v;b.setAttribute("aria-pressed","false");const n=ITEMS.filter(it=>it.shikaku.includes(v)).length;b.innerHTML=`<img src="icons/${ICON[v]}.png?v=1004" alt="" width="64" height="64" loading="lazy"><span class="nm">${v}</span><span class="ct">${n}点</span>`;b.onclick=()=>{st.shikaku=st.shikaku===v?null:v;render();$("result").scrollIntoView({behavior:"smooth",block:"start"})};$("cats").appendChild(b)});
$("stats").innerHTML=`<span><b>${ITEMS.length}</b>点</span><span><b>${SHIKAKU.length}</b>分野</span><span><b>3</b>本のスライドのひな形</span>`;
let qt;$("q").oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{st.q=e.target.value.trim();render()},150)};
$("f-fav").onclick=()=>{st.fav=!st.fav;render()};
$("clear").onclick=()=>{Object.assign(st,{dankai:null,shikaku:null,kind:null,q:"",fav:false});$("q").value="";render()};
$("grid").addEventListener("click",e=>{const b=e.target.closest(".star");if(!b)return;const on=favToggle(b.dataset.id);b.setAttribute("aria-pressed",on);b.textContent=on?"★":"☆";b.setAttribute("aria-label",on?"お気に入りから外す":"お気に入りに入れる");if(st.fav)render();else favCount()});
function favCount(){$("f-fav").textContent="★ お気に入りだけ（"+favLoad().size+"点）"}
function card(it,fav){return `<article class="card"><button class="star" data-id="${it.id}" aria-pressed="${fav.has(it.id)}" aria-label="${fav.has(it.id)?"お気に入りから外す":"お気に入りに入れる"}">${fav.has(it.id)?"★":"☆"}</button><a class="pic" href="i/${it.id}.html" tabindex="-1"><img loading="lazy" src="img/${it.id}_thumb.jpg" alt="${esc(it.alt)}"></a><div class="b"><h3><a href="i/${it.id}.html">${esc(it.title)}</a></h3><div class="tagline">${it.shikaku.map(x=>`<span>${esc(x)}</span>`).join("")}<span>${esc(it.dankai)}</span></div><div class="d"><a class="btn" href="img/${it.id}.jpg" download>カラー</a><a class="btn sub" href="img/${it.id}_mono.jpg" download>白黒</a></div></div></article>`}
function render(){
  document.querySelectorAll("#f-dankai .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===st.dankai));
  document.querySelectorAll("#f-kind .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===st.kind));
  document.querySelectorAll("#cats .cat").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===st.shikaku));
  $("f-fav").setAttribute("aria-pressed",st.fav);favCount();
  const fav=favLoad();
  const hit=ITEMS.filter(it=>(!st.fav||fav.has(it.id))&&(!st.dankai||it.dankai===st.dankai)&&(!st.shikaku||it.shikaku.includes(st.shikaku))&&(!st.kind||it.kind===st.kind)&&(!st.q||(it.title+it.description+it.tags.join(" ")+it.shikaku.join(" ")).includes(st.q)));
  const cond=[st.shikaku,st.dankai,st.kind,st.fav?"お気に入り":null,st.q?"「"+st.q+"」":null].filter(Boolean);
  $("count").innerHTML=hit.length+"<small>点</small>";
  $("cond").textContent=cond.length?cond.join("　／　")+" の絵":"すべての絵";
  $("clear").hidden=!cond.length;
  $("grid").innerHTML=hit.length?hit.map(it=>card(it,fav)).join(""):`<p class="empty">${st.fav&&!fav.size?"お気に入りはまだありません。絵の右上の☆を押すと入ります。":"この条件の絵はありません。条件を外すか、「要望を送る」から頼んでください。"}</p>`;
}
render();
</script>
</body></html>
