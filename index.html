<header class="top"><a class="logo" href="./">士業ストック</a><nav><a href="./">素材をさがす</a><a href="templates.html">スライドのひな形</a><a href="yobo.html">要望を送る</a><a href="about.html">このサイトについて</a><a href="terms.html">利用の決まり</a></nav></header>
<section class="hero">
  <h1>石山通りグループの<br>仕事を絵で説明する素材</h1>
  <p>石山通りグループの説明会の資料、仕事の流れの説明、社内の資料、採用の案内に使うイラストです。相談から完了まで、段階ごとに同じ絵柄でそろえています。社内のイベントや、業務の見直しの資料に使う絵もあります。</p>
  <div class="flow" id="flow" aria-label="段階で絞りこむ"></div>
</section>
<section class="filters">
  <div class="row"><span class="lab">分野</span><span id="f-shikaku"></span></div>
  <div class="row"><span class="lab">種類</span><span id="f-kind"></span></div>
  <div class="row"><span class="lab">印</span><button class="chip" id="f-fav" aria-pressed="false">★ お気に入りだけ</button></div>
  <div class="row"><input id="q" type="search" placeholder="ことばでさがす（例　立会い、相談、境界）" aria-label="ことばでさがす"></div>
</section>
<p class="count" id="count"></p>
<main class="grid" id="grid"></main>
<p class="note">絵はAIで下絵を作り、人が1枚ずつ確かめています。スライドのひな形は「スライドのひな形」のページにあります。絵の右上の☆を押すとお気に入りに入ります。お気に入りは、使っているブラウザだけに残ります。</p>
<footer>© 石山通りグループ　<a href="terms.html">利用の決まり</a></footer>
<script src="items.js"></script>
<script src="fav.js?v=1004"></script>
<script>
const DANKAI=["相談","見積もり","調査","現場","書類","申請","完了","その後"];
const SHIKAKU=["共通","司法書士","土地家屋調査士","行政書士","社労士","税理士","弁護士","社内イベント","業務の見直し"];
const KIND=["人","場面","道具","書類の形","場所","図解の部品"];
const st={style:null,dankai:null,shikaku:null,kind:null,q:"",fav:false};
function chips(el,list,key,cls){el.innerHTML="";list.forEach(v=>{const b=document.createElement("button");b.className=cls;b.textContent=v;b.setAttribute("aria-pressed","false");b.onclick=()=>{st[key]=st[key]===v?null:v;render()};el.appendChild(b)})}
chips(document.getElementById("flow"),DANKAI,"dankai","");
chips(document.getElementById("f-shikaku"),SHIKAKU,"shikaku","chip");
chips(document.getElementById("f-kind"),KIND,"kind","chip");
document.getElementById("q").oninput=e=>{st.q=e.target.value.trim();render()};
document.getElementById("f-fav").onclick=()=>{st.fav=!st.fav;render()};
document.getElementById("grid").addEventListener("click",e=>{const b=e.target.closest(".star");if(!b)return;const on=favToggle(b.dataset.id);b.setAttribute("aria-pressed",on);b.textContent=on?"★":"☆";b.setAttribute("aria-label",on?"お気に入りから外す":"お気に入りに入れる");if(st.fav)render();else favCount()});
function favCount(){document.getElementById("f-fav").textContent="★ お気に入りだけ（"+favLoad().size+"点）"}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
  document.querySelectorAll("#flow button").forEach(b=>b.setAttribute("aria-pressed",b.textContent===st.dankai));
  document.querySelectorAll("#f-shikaku .chip").forEach(b=>b.setAttribute("aria-pressed",b.textContent===st.shikaku));
  document.querySelectorAll("#f-kind .chip").forEach(b=>b.setAttribute("aria-pressed",b.textContent===st.kind));
  document.getElementById("f-fav").setAttribute("aria-pressed",st.fav);favCount();
  const fav=favLoad();
  const hit=ITEMS.filter(it=>(!st.fav||fav.has(it.id))&&(!st.dankai||it.dankai===st.dankai)&&(!st.shikaku||it.shikaku.includes(st.shikaku))&&(!st.kind||it.kind===st.kind)&&(!st.q||(it.title+it.description+it.tags.join(" ")).includes(st.q)));
  document.getElementById("count").textContent=hit.length+"点"+(st.fav&&!hit.length?"　お気に入りはまだありません。絵の右上の☆を押すと入ります。":"");
  document.getElementById("grid").innerHTML=hit.map(it=>`<article class="card"><button class="star" data-id="${it.id}" aria-pressed="${fav.has(it.id)}" aria-label="${fav.has(it.id)?"お気に入りから外す":"お気に入りに入れる"}">${fav.has(it.id)?"★":"☆"}</button><a class="pic" href="i/${it.id}.html"><img loading="lazy" src="img/${it.id}_thumb.jpg" alt="${esc(it.alt)}"></a><div class="b"><h3>${esc(it.title)}</h3><div class="m">${esc(it.shikaku.join("、"))}　${esc(it.dankai)}</div><div class="d"><a class="btn" href="img/${it.id}.jpg" download>カラー</a><a class="btn sub" href="img/${it.id}_mono.jpg" download>白黒</a></div></div></article>`).join("");
}
render();
</script>
</body></html>
